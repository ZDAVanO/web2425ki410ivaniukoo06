name: Deploy to InfinityFree

on:
  workflow_dispatch:

jobs:
  web-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🔐 Create config.php
        run: |
          echo "<?php" > config.php
          echo "return [" >> config.php
          echo "'servername' => '${{ secrets.DB_SERVERNAME }}'," >> config.php
          echo "'username' => '${{ secrets.DB_USERNAME }}'," >> config.php
          echo "'password' => '${{ secrets.DB_PASSWORD }}'," >> config.php
          echo "'dbname' => '${{ secrets.DB_DBNAME }}'" >> config.php
          echo "];" >> config.php

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}

      - name: 📦 Create deployment artifact
        run: |
          zip -r deploy.zip . -x ".*" -x "deploy.zip" -x "config.php"
        
  
      - name: 💾 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifact
          path: deploy.zip

